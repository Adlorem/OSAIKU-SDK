[package]
name = "osaiku-package"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Bounded application package and repository verification, without allocation or I/O"

[dependencies]
sha2 = { version = "=0.10.9", default-features = false }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }

[[example]]
name = "package-check"
path = "examples/package-check.rs"
