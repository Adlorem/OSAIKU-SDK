[package]
name = "osaiku-runtime"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Experimental no_std native OSAIKU syscall and process contracts"

[dependencies]
osaiku-gpu-protocol = { path = "../gpu-protocol" }
osaiku-gpu-runtime = { path = "../gpu-runtime" }
osaiku-wifi-protocol = { path = "../wifi-protocol" }
zeroize = { version = "=1.8.2", default-features = false }
osaiku-network-protocol = { path = "../network-protocol" }
osaiku-package = { path = "../package", default-features = false }
osaiku-ui = { path = "../ui", default-features = false }
sha2 = { version = "=0.10.9", default-features = false }

[dev-dependencies]
osaiku-driver-protocol = { path = "../driver-protocol" }
osaiku-ui = { path = "../ui", features = ["compiler"] }
