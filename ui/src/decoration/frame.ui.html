<main id="frame">
  <section id="content-slot"></section>
  <button id="drag" action="drag"></button>
  <ui-icon id="window-icon" bind:text="window-icon"></ui-icon>
  <span id="title" bind:text="window-title">OSAIKU</span>
  <button id="resize-left" class="resize" action="resize-left"></button>
  <button id="resize-right" class="resize" action="resize-right"></button>
  <button id="resize-top" class="resize" action="resize-top"></button>
  <button id="resize-bottom" class="resize" action="resize-bottom"></button>
  <button id="resize-tl-left" class="resize" action="resize-tl-left"></button>
  <button id="resize-tl-top" class="resize" action="resize-tl-top"></button>
  <button id="resize-tr-right" class="resize" action="resize-tr-right"></button>
  <button id="resize-tr-top" class="resize" action="resize-tr-top"></button>
  <button id="resize-bl-left" class="resize" action="resize-bl-left"></button>
  <button id="resize-bl-bottom" class="resize" action="resize-bl-bottom"></button>
  <button id="resize-br-right" class="resize" action="resize-br-right"></button>
  <button id="resize-br-bottom" class="resize" action="resize-br-bottom"></button>
  <button id="close" action="close">×</button>
</main>
